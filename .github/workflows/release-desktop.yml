# Builds the Narada desktop app for macOS, Windows and Linux when a version tag (v1.2.3) is
# pushed, and attaches the installers to a draft GitHub release with that name. Check the draft,
# then publish it.
#
# The tag must match "version" in apps/desktop/src-tauri/tauri.conf.json.
#
# macOS builds are signed ad hoc (bundle.macOS.signingIdentity "-" in tauri.conf.json), so
# macOS offers "Open Anyway". They are not notarized unless these repository secrets are set (an Apple
# Developer ID): APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID. Add them to the tauri-action step's env when you have them.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: ""
          - name: Linux
            os: ubuntu-22.04
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: Narada ${{ github.ref_name }}
          releaseBody: |
            A free, local-first, Postman-compatible API client. Download the installer for your
            computer below; see the README for the first-launch steps on macOS.

            - **macOS**: `Narada_*_aarch64.dmg` (Apple Silicon) or `Narada_*_x64.dmg` (Intel)
            - **Windows**: `Narada_*_x64-setup.exe` (or the `.msi`)
            - **Linux**: `.AppImage`, `.deb` or `.rpm`
          releaseDraft: true
          prerelease: false

      # An app whose signature doesn't verify is reported as "damaged" on Apple Silicon, and
      # macOS offers no way to open it.
      - name: Check the macOS app's signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Narada.app"
