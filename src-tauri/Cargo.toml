[package]
name = "narada"
version = "0.1.0"
description = "A free, local-first API client"
authors = ["Gokul Kulkarni"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "narada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "cookies", "gzip", "brotli", "deflate", "json", "form", "query"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-dialog = "2"
sha2 = "0.11.1"
base64 = "0.23.1"
md-5 = "0.11.0"
rand = "0.9"
rmcp = { version = "3.8", default-features = false, features = ["base64", "client", "macros", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
